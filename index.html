<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App-Wk2</title>

    <style>
      body {
        font-family: sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding-top: 40px;
      }

      .weather-app {
        text-align: center;
        max-width: 400px;
        width: 100%;
        padding: 20px;
        margin: 0 auto;
      }

      .weather-icon {
        font-size: 48px;
        margin-bottom: 15px;
      }

      h1 {
        color: #1a56db;
        font-size: 36px;
        font-weight: 700;
        margin: 0 0 12px 0;
        line-height: 1.8;
      }

      .current-range {
        font-size: 28px;
        color: #111827;
        margin-bottom: 40px;
      }

      .forecast-container {
        margin-bottom: 40px;
      }

      .forecast-row {
        margin-bottom: 15px;
        padding: 12px 20px;
        border-radius: 8px;
        transition: background-color 200ms ease-in-out;
      }

      .forecast-row:hover {
        background-color: #fffbeb;
        cursor: pointer;
      }

      .day-name {
        font-size: 20px;
        font-weight: bold;
        color: #000000;
        margin-bottom: 6px;
      }

      .day-temp {
        font-size: 16px;
        color: #6b7280;
      }

      .forecast-row strong {
        font-weight: bold;
        color: #676d7c;
      }

      strong {
        color: #000000;
        font-weight: bold;
      }

      .change-city-btn {
        background-color: #1a64d6;
        color: white;
        border: 1px solid #1a64d6;
        padding: 14px 32px;
        font-size: 16px;
        border-radius: 30px;
        cursor: pointer;
        transition: all 200ms ease-in-out;
      }

      .change-city-btn:hover {
        background-color: #ffffff;
        color: #1a64d6;
      }

      .credits {
        margin-top: 35px;
        font-family: monospace;
        color: #6b7280;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="weather-app">
      <div class="current-weather">
        <h1>⛅<br />Currently 21° in Tokyo</h1>
        <div class="current-range">13° / <strong>23°</strong></div>
      </div>

      <div class="forecast-container">
        <div class="forecast-row">
          <div class="day-name">🌧️ Tomorrow</div>
          <div class="day-temp">10° / <strong>22°</strong></div>
        </div>

        <div class="forecast-row">
          <div class="day-name">☁️ Saturday</div>
          <div class="day-temp">15° / <strong>17°</strong></div>
        </div>

        <div class="forecast-row">
          <div class="day-name">🌞 Sunday</div>
          <div class="day-temp">25° / <strong>28°</strong></div>
        </div>
      </div>

      <button class="change-city-btn">Change city</button>
      <p class="credits">Coded by Tammy Richards</p>
    </div>

    <script>
      function changeCity() {
        let city = prompt("What city do you live in?");
        let temperature = prompt("What temperature is it?");

        if (!city || !temperature) {
          return;
        }

        let heading = document.querySelector("h1");

        let emoji = "⛅";
        if (Number(temperature) >= 30) {
          emoji = "😁";
        } else if (Number(temperature) < 10) {
          emoji = "🥶";
        }

        heading.innerHTML =
          emoji + "<br />Currently " + temperature + "°C in " + city;
      }

      let changeCityButton = document.querySelector(".change-city-btn");
      changeCityButton.addEventListener("click", changeCity);
    </script>
  </body>
</html>
